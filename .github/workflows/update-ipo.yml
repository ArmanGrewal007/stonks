name: Update IPO Tracker

on:
  workflow_dispatch:
  schedule:
    - cron: '15 3,15 * * *'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup uv
        uses: astral-sh/setup-uv@v4

      - name: Sync dependencies
        run: uv sync

      - name: Run IPO tracker
        run: uv run src/ipo_tracker.py

      - name: Commit updated data
        run: |
          if [ -z "$(git status --porcelain data/mainboard_ipos.xlsx data/source_snapshot.json)" ]; then
            echo "No changes to commit"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/mainboard_ipos.xlsx data/source_snapshot.json
          git commit -m "chore: update IPO tracker data"
          git push
